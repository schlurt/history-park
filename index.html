<!DOCTYPE html>
<html>
<head>

<title>Divided Nation Theme Park</title>

<style>

body {
font-family: Arial, sans-serif;
background:#d8c3a5;
text-align:center;
}

h1 {
color:#4b2e1e;
}

#park {
width:800px;
height:600px;
margin:auto;
background:#8fbf7f;
border:5px solid black;
position:relative;
}


.area {
position:absolute;
padding:20px;
color:white;
font-weight:bold;
cursor:pointer;
border-radius:15px;
}

.area:hover {
transform:scale(1.1);
}


.north {
background:#4169e1;
left:50px;
top:80px;
}

.battles {
background:#8b0000;
left:300px;
top:220px;
}

.south {
background:#555;
right:50px;
top:80px;
}

.slavery {
background:#8b4513;
left:80px;
bottom:70px;
}

.after {
background:#228b22;
right:80px;
bottom:70px;
}



#menu {
width:600px;
margin:20px auto;
background:white;
border-radius:15px;
padding:20px;
display:none;
text-align:left;
}


li {
margin:10px;
font-size:18px;
}

</style>

</head>


<body>


<h1>⚔️ Divided Nation Civil War Theme Park ⚔️</h1>


<div id="park">


<div class="area north" onclick="showRides('north')">
🔵 North Area
</div>


<div class="area battles" onclick="showRides('battles')">
⚔️ Major Battles
</div>


<div class="area south" onclick="showRides('south')">
⚫ South Area
</div>


<div class="area slavery" onclick="showRides('slavery')">
🌱 Life of Slavery
</div>


<div class="area after" onclick="showRides('after')">
🔧 After the War
</div>


</div>



<div id="menu"></div>



<script>


function showRides(section){


let info="";


if(section=="north"){

info=`
<h2>🔵 North Area Rides</h2>
<ul>
<li>🚂 Union Express Railroad - Learn how railroads helped the Union.</li>

<li>🎢 Gettysburg Thunder Coaster - A coaster about Union victories.</li>

<li>🎩 Lincoln's Leadership Challenge - Make wartime decisions as Lincoln.</li>
</ul>`;
}



if(section=="battles"){

info=`
<h2>⚔️ Major Battles Rides</h2>
<ul>

<li>🎢 Gettysburg Thunder Coaster - Experience the famous battle.</li>

<li>💥 Pickett's Charge Drop Tower - Based on the final attack.</li>

<li>🎥 Battlefield 360 Experience - Watch the battle unfold around you.</li>

</ul>`;
}



if(section=="south"){

info=`
<h2>⚫ South Area Rides</h2>

<ul>

<li>🎢 Rebel Run Coaster - Ride through Confederate battle scenes.</li>

<li>🚂 Dixie Railroad Express - Explore Southern railroads.</li>

<li>🌊 Bayou Rapids - River ride through Southern landscapes.</li>

</ul>`;
}



if(section=="slavery"){

info=`
<h2>🌱 Life of Slavery Attractions</h2>

<ul>

<li>🚪 Underground Railroad Escape - Learn about escapes to freedom.</li>

<li>🍽️ Freedom Kitchen - Explore African American food traditions.</li>

<li>🎭 Voices of Freedom Theater - Hear stories of enslaved people.</li>

</ul>`;
}



if(section=="after"){

info=`
<h2>🔧 After the War Attractions</h2>

<ul>

<li>🏗️ Reconstruction Builder - Rebuild towns after the war.</li>

<li>📜 Freedom Walk - Learn about new laws and rights.</li>

<li>🗳️ Voting Rights Challenge - Explore changes after the war.</li>

</ul>`;
}



document.getElementById("menu").innerHTML=info;

document.getElementById("menu").style.display="block";


}


</script>


</body>
</html>
