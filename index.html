<!DOCTYPE html>
<html>
<head>
<title>Divided Nation Theme Park</title>

<style>
body {
font-family: Arial, sans-serif;
background-color: #d8c3a5;
text-align: center;
}

h1 {
color: #4b2e1e;
}

#park {
width: 800px;
height: 600px;
margin: auto;
background-color: #8fbf7f;
border: 5px solid #333;
position: relative;
}

.area {
position: absolute;
padding: 20px;
color: white;
font-weight: bold;
cursor: pointer;
border-radius: 15px;
}

.area:hover {
transform: scale(1.1);
}

/* Park Sections */

.north {
background:#4169e1;
left:50px;
top:80px;
}

.battles {
background:#8b0000;
left:300px;
top:220px;
}

.south {
background:#555;
right:50px;
top:80px;
}

.slavery {
background:#8b4513;
left:80px;
bottom:70px;
}

.life {
background:#228b22;
right:80px;
bottom:70px;
}


#info {
width:700px;
margin:20px auto;
background:white;
padding:20px;
border-radius:15px;
display:none;
}

</style>

</head>


<body>

<h1>⚔️ Divided Nation: Civil War Theme Park ⚔️</h1>


<div id="park">

<div class="area north" onclick="showInfo('north')">
The South
</div>


<div class="area battles" onclick="showInfo('battles')">
Major Battlefields
</div>


<div class="area south" onclick="showInfo('south')">
Life of Slavery
</div>


<div class="area slavery" onclick="showInfo('slavery')">
The North
</div>


<div class="area life" onclick="showInfo('life')">
Gettysburg
</div>

</div>



<div id="info"></div>



<script>

function showInfo(area){

let text="";


if(area=="north"){
text = `
<h2>🔵 The Union</h2>
<p>
Explore the North with rides like Union Express Railroad,
Gettysburg Thunder Coaster, and Lincoln's Leadership Challenge.
Learn how industry, railroads, and resources helped the Union.
</p>`;
}


if(area=="battles"){
text = `
<h2>⚔️ Major Battlefields</h2>
<p>
Experience rides like Gettysburg Thunder Coaster,
Pickett's Charge Drop Tower, and Battlefield 360.
Discover the most important battles of the Civil War and
how they changed the future of the country.
</p>`;
}


if(area=="south"){
text = `
<h2>🔴 The Confederacy</h2>
<p>
Ride Rebel Run Coaster, Fort Sumter Siege, and Dixie Railroad Express.
Learn about Southern strategies, military camps, and challenges.
</p>`;
}


if(area=="slavery"){
text = `
<h2>🌱 Life of Slavery</h2>
<p>
Visit Freedom Kitchen, Underground Railroad Escape, and
interactive exhibits that explain the experiences of enslaved people,
their struggles, culture, and fight for freedom.
</p>`;
}


if(area=="life"){
text = `
<h2>🎩 Gettysburg</h2>
<p>
Learn how America changed after the Civil War, including rebuilding,
new laws, and the challenges of bringing the nation back together.
</p>`;
}



document.getElementById("info").innerHTML=text;
document.getElementById("info").style.display="block";

}

</script>


</body>
</html>
